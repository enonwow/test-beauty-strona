<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logowanie do panelu studia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
<script src="mock.js" defer></script>
<script src="panel-shell.js" defer></script>
<style>
.wrap{min-height:calc(100vh - 28px);box-sizing:border-box;padding:24px 16px;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:15px;color:#1E1A1D}
.card{width:100%;max-width:420px;box-sizing:border-box;background:#fff;border:1px solid #F0E8EC;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.lg-in{min-height:52px;width:100%;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid #C9B6BF;font:inherit;font-size:16px;background:#fff;color:#1E1A1D}
.lg-in[aria-invalid="true"]{border-color:#A3262A}
.lg-err{margin:0;color:#A3262A;font-size:13px}
.lg-lab{display:flex;flex-direction:column;gap:6px;font-weight:500}
.lg-btn{min-height:52px;padding:0 16px;border-radius:12px;border:0;background:#9E1F50;color:#fff;font:inherit;font-weight:700;cursor:pointer}.lg-btn:hover{background:#7A173D}
.lg-link{min-height:44px;padding:0 4px;border:0;background:none;color:#9E1F50;font:inherit;text-decoration:underline;cursor:pointer;align-self:flex-start}
.lg-tab{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:#1E1A1D;font:inherit;cursor:pointer}
.lg-tab[aria-selected="true"]{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(30,26,29,.15)}
:focus-visible{outline:2px solid #9E1F50;outline-offset:2px}
</style>
</head>
<body>
<div class="mock-bar">Makieta, dane przykładowe · <a href="start.html">Start</a> · <a href="salon.html">Strona studia</a> · <a href="dla-studiow.html">Dla studiów</a></div>
<main class="wrap">
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;border-radius:10px;background:#9E1F50;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700">NS</div><span style="font-weight:700">[Nazwa studia]</span></div>
    <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:26px">Zaloguj się do panelu</h1>

    <div role="tablist" aria-label="Sposób logowania" style="display:flex;gap:4px;padding:4px;border-radius:14px;background:#F0E8EC">
      <button type="button" role="tab" class="lg-tab" id="tab-pw" aria-selected="true" aria-controls="p-pw">E-mail i hasło</button>
      <button type="button" role="tab" class="lg-tab" id="tab-sms" aria-selected="false" aria-controls="p-sms">Kod SMS</button>
    </div>

    <form id="p-pw" role="tabpanel" aria-labelledby="tab-pw" novalidate style="display:flex;flex-direction:column;gap:14px">
      <label class="lg-lab" for="email">Adres e-mail<input id="email" class="lg-in" type="email" autocomplete="email" inputmode="email" placeholder="np. imie@studio.pl"></label>
      <div class="lg-lab"><label for="pw">Hasło</label>
        <div style="display:flex;gap:8px"><input id="pw" class="lg-in" type="password" autocomplete="current-password"><button type="button" id="show" class="lg-link" aria-pressed="false" aria-controls="pw" style="text-decoration:none;border:1px solid #E4D9DE;border-radius:12px;padding:0 14px;color:#1E1A1D;align-self:auto;white-space:nowrap">Pokaż</button></div>
      </div>
      <button type="button" class="lg-link" id="forgot">Nie pamiętasz hasła?</button>
      <button type="submit" class="lg-btn">Zaloguj</button>
      <span style="color:#625860;font-size:12px">Makieta: wejdziesz z dowolnym poprawnym adresem i hasłem od 8 znaków.</span>
    </form>

    <form id="p-sms" role="tabpanel" aria-labelledby="tab-sms" novalidate hidden style="display:flex;flex-direction:column;gap:14px">
      <label class="lg-lab" for="tel">Numer telefonu<input id="tel" class="lg-in" type="tel" autocomplete="tel" inputmode="tel" placeholder="+48 …"></label>
      <button type="button" class="lg-btn" id="send" style="background:#1E1A1D">Wyślij kod</button>
      <div id="code-box" hidden style="display:flex;flex-direction:column;gap:14px">
        <label class="lg-lab" for="code">Kod z SMS-a (6 cyfr)<input id="code" class="lg-in" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" style="letter-spacing:.2em;text-align:center"></label>
        <span id="count" class="lg-err" style="color:#625860" role="status"></span>
        <button type="submit" class="lg-btn">Zaloguj</button>
      </div>
      <span style="color:#625860;font-size:12px">Makieta: kod SMS nie jest wysyłany, wpisz dowolne 6 cyfr.</span>
    </form>

    <p style="margin:0;padding-top:8px;border-top:1px solid #F0E8EC">Nie masz konta? <a href="onboarding.html">Załóż studio</a></p>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = s => document.querySelector(s);
  const E = PS.esc;
  // Błąd przy polu: tekst pod polem + aria-invalid/aria-describedby; zwraca true, gdy są błędy i ustawia fokus na pierwszym.
  function check(rules) {
    let first = null;
    rules.forEach(([input, msg]) => {
      let p = document.getElementById(input.id + '-err');
      if (p) p.remove();
      input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby');
      if (!msg) return;
      p = document.createElement('p'); p.className = 'lg-err'; p.id = input.id + '-err'; p.setAttribute('role', 'alert'); p.textContent = msg;
      (input.closest('.lg-lab') || input.parentElement).append(p);
      input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', p.id);
      first = first || input;
    });
    if (first) first.focus();
    return !!first;
  }
  const mail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  function enter(u) { Mock.set('studioUser', u); Mock.toast('Zalogowano'); setTimeout(() => { location.href = 'panel.html'; }, 500); }

  // zakładki
  const tabs = { pw: ['#tab-pw', '#p-pw'], sms: ['#tab-sms', '#p-sms'] };
  function show(k) { Object.entries(tabs).forEach(([n, [t, p]]) => { $(t).setAttribute('aria-selected', String(n === k)); $(p).hidden = n !== k; }); }
  $('#tab-pw').addEventListener('click', () => show('pw'));
  $('#tab-sms').addEventListener('click', () => show('sms'));
  [$('#tab-pw'), $('#tab-sms')].forEach(t => t.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const k = t.id === 'tab-pw' ? 'sms' : 'pw'; show(k); $(tabs[k][0]).focus(); } }));

  // e-mail i hasło
  $('#show').addEventListener('click', () => { const on = $('#pw').type === 'password'; $('#pw').type = on ? 'text' : 'password'; $('#show').textContent = on ? 'Ukryj' : 'Pokaż'; $('#show').setAttribute('aria-pressed', String(on)); });
  $('#p-pw').addEventListener('submit', e => {
    e.preventDefault();
    const m = $('#email').value.trim(), p = $('#pw').value;
    if (check([[$('#email'), !m ? 'Wpisz adres e-mail.' : !mail(m) ? 'Wpisz poprawny adres e-mail, np. imie@studio.pl.' : ''], [$('#pw'), !p ? 'Wpisz hasło.' : p.length < 8 ? 'Hasło ma co najmniej 8 znaków.' : '']])) return;
    const l = m.split('@')[0].split(/[._-]/)[0];
    enter({ imie: l.charAt(0).toUpperCase() + l.slice(1), email: m, rola: 'właścicielka' });
  });
  $('#forgot').addEventListener('click', () => PS.modal({
    title: 'Nie pamiętasz hasła?', ok: 'Wyślij link',
    body: `<label class="p-lab" for="fe">Adres e-mail konta<input class="p-in" id="fe" name="e" type="email" autocomplete="email" value="${E($('#email').value.trim())}"></label><span class="p-mut">Wyślemy link do ustawienia nowego hasła. Link działa godzinę.</span>`,
    onOk: f => { if (!mail(f.e.value.trim())) { f.e.setAttribute('aria-invalid', 'true'); Mock.toast('Wpisz poprawny adres e-mail'); f.e.focus(); return false; } },
    toast: f => `Wysłaliśmy link na ${f.e.value.trim()}`
  }));

  // kod SMS
  let timer = null;
  $('#code').addEventListener('input', e => { const d = e.target.value.replace(/\D/g, '').slice(0, 6); e.target.value = d.length > 3 ? d.slice(0, 3) + ' ' + d.slice(3) : d; });
  $('#send').addEventListener('click', () => {
    const t = $('#tel').value.replace(/[^\d+]/g, '');
    if (check([[$('#tel'), !t ? 'Wpisz numer telefonu.' : t.replace(/\D/g, '').length < 9 ? 'Numer ma co najmniej 9 cyfr.' : '']])) return;
    $('#code-box').hidden = false; $('#code').focus(); Mock.toast('Wysłaliśmy kod SMS');
    let s = 30; $('#send').disabled = true; clearInterval(timer);
    const tick = () => { $('#count').textContent = s > 0 ? `Nowy kod możesz wysłać za ${s} s` : ''; if (s-- <= 0) { clearInterval(timer); $('#send').disabled = false; $('#send').textContent = 'Wyślij kod ponownie'; } };
    tick(); timer = setInterval(tick, 1000);
  });
  $('#p-sms').addEventListener('submit', e => {
    e.preventDefault();
    if (check([[$('#code'), $('#code').value.replace(/\D/g, '').length === 6 ? '' : 'Wpisz 6-cyfrowy kod z SMS-a.']])) return;
    enter({ imie: '[Właścicielka]', email: '', tel: $('#tel').value.trim(), rola: 'właścicielka' });
  });
});
</script>
</body>
</html>
