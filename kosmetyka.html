<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zabieg na twarz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="desktop.css">
<script src="mock.js" defer></script>
</head>
<body>
<div class="mock-bar">Makieta, dane przykładowe · <a href="start.html">Start</a> · <a href="salon.html">Strona studia</a> · <a href="panel.html">Panel studia</a> · <a href="dla-studiow.html">Dla studiów</a></div>
<div class="d-page" style="min-height: 100vh; background: #FFFFFF; color: #1E1A1D; font-family: 'DM Sans', sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="padding: 16px 20px 12px; display: flex; align-items: center; gap: 12px">
    <a href="start.html" data-back aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4D9DE; display: flex; align-items: center; justify-content: center; color: #1E1A1D; flex: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="color: #625860; font-size: 12px">Kosmetologia · Studio Malwa</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Zabieg na twarz</h1>
    </div>
    <button type="button" id="odNowa" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #E4D9DE; background: #FFFFFF; color: #625860; font: inherit; font-size: 13px; cursor: pointer">Od nowa</button>
  </header>
  <nav id="kroki" aria-label="Kroki" style="padding: 0 20px 12px; display: grid; gap: 4px; border-bottom: 1px solid #F0E8EC"></nav>
  <div class="d-cols" style="flex: 1">
    <div id="kreator" class="d-main" style="padding: 0 20px; display: flex; flex-direction: column"></div>
    <div id="kreator-bar" class="d-aside"></div>
  </div>
</div>
<script src="kreator.js"></script>
<script>
// Treatment area on a stock photo: the chosen area as a soft accent tint with a thin feathered outline.
// Outlines traced by hand on the files below (pixels of each file); after a new crop they must be traced again.
const FOTO = { twarz: ['zdjecia/kosmetologia-1.jpg', 640, 800], oczy: ['zdjecia/oczy-1.jpg', 1600, 1100], plecy: ['zdjecia/plecy-1.jpg', 1600, 1333] };
const OBSZAR = {
  T: ['twarz', 'twarz', 'M215 95 L290 58 L380 45 L460 70 L510 118 L528 175 L522 240 L505 300 L480 345 L430 378 L370 398 L320 398 L270 380 L225 345 L198 295 L185 235 L192 165 Z'],
  TS: ['twarz', 'twarz i szyja', 'M215 95 L290 58 L380 45 L460 70 L510 118 L528 175 L522 240 L505 300 L480 345 L455 420 L430 500 L415 560 L330 575 L210 560 L125 525 L150 462 L185 385 L198 295 L185 235 L192 165 Z'],
  TSD: ['twarz', 'twarz, szyja i dekolt', 'M215 95 L290 58 L380 45 L460 70 L510 118 L528 175 L522 240 L505 300 L480 345 L455 420 L430 500 L445 560 L520 575 L640 588 L640 622 L480 640 L320 642 L160 636 L0 630 L0 560 L60 552 L125 525 L150 462 L185 385 L198 295 L185 235 L192 165 Z'],
  // skin around the eye: an outer ellipse with the eye opening cut out (evenodd)
  oczy: ['oczy', 'okolice oczu', 'M30 700 A760 380 0 1 0 1550 700 A760 380 0 1 0 30 700 Z M180 760 A565 185 -6 1 0 1310 690 A565 185 -6 1 0 180 760 Z'],
  plecy: ['plecy', 'plecy', 'M330 0 L360 200 L420 390 L500 560 L570 720 L620 880 L610 960 L560 1060 L700 1120 L900 1200 L1100 1250 L1350 1290 L1600 1310 L1600 0 Z'],
};
let nFiltr = 0; // the area picture is drawn more than once per page: each blur filter needs its own id
function areas(obszar) {
  const fid = `miek-${++nFiltr}`;
  const [foto, label, d] = OBSZAR[obszar] || OBSZAR.T, [src, w, h] = FOTO[foto];
  // spotlight: the area keeps the photo's real colours, everything else is dimmed (evenodd cuts the area out of the frame)
  return `<span role="img" aria-label="Zaznaczony obszar: ${label}" style="position: relative; display: block; width: 100%; max-width: calc(34vh * ${w} / ${h}); margin: 0 auto; aspect-ratio: ${w} / ${h}; border-radius: 14px; overflow: hidden; background: #F6EDF1">`
    + `<img src="${src}" alt="" width="${w}" height="${h}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">`
    + `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><defs><filter id="${fid}" x="-2%" y="-2%" width="104%" height="104%"><feGaussianBlur stdDeviation="${w / 160}"></feGaussianBlur></filter></defs>`
    + `<path d="M0 0 H${w} V${h} H0 Z ${d}" fill="#1E1A1D" fill-opacity=".55" fill-rule="evenodd" filter="url(#${fid})"></path>`
    + `<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path></svg>`
    + `<span style="position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.92); color: #1E1A1D; font-size: 13px; font-weight: 700">${label[0].toUpperCase() + label.slice(1)}</span></span>`;
}
const by = (list, id) => list.find(x => x.id === id);
const offered = c => c.zabiegi.filter(z => !z.wymagaFlagiSalonu || c.flagiSalonu[z.wymagaFlagiSalonu]);
const z = (c, w) => by(c.zabiegi, w.zabieg);
const range = zb => { const v = zb.warianty ? zb.warianty.map(x => x.cena) : ['T', 'TS', 'TSD'].map(o => Kreator.obszarCena(zb, o).cena); return Kreator.zlRange(Math.min(...v), Math.max(...v)); };
const MODE = { doplata: 'twarz + stała dopłata za szyję lub dekolt', okolice: 'cena za liczbę okolic' };

Kreator.ui({
  kat: 'kosmetologia', nazwa: 'Kosmetologia',
  preview: (w, c) => (z(c, w).warianty ? `<div style="color: #625860; font-size: 14px">Masaż Kobido · ${z(c, w).warianty[w.kobido]?.min ?? 60} min</div>` : areas(w.obszar)),
  defaults: () => ({ cel: 'przebarwienia', skora: 'mieszana', zabieg: 'kwas_migdalowy', obszar: 'TS', kobido: '0', dodatki: ['warstwa_kwasu'], seria: '5', pierwsza: 'tak' }),
  dalej: () => 'Dalej: przeciwwskazania',
  steps: c => {
    const fixArea = w => { // the area must exist for the new treatment; add-ons must apply to it
      const zb = z(c, w);
      if (zb.warianty) return;
      if ((w.obszar === 'oczy' && !zb.oczy) || (w.obszar === 'plecy' && !zb.plecy)) w.obszar = 'T';
      w.dodatki = w.dodatki.filter(id => { const d = by(c.dodatki, id); return d.dotyczy.includes(zb.id) && d.ceny[w.obszar] !== undefined; });
    };
    const polec = w => { const cel = by(c.ankieta.cel, w.cel), avoid = by(c.ankieta.skora, w.skora).unikaj || []; return avoid.includes(cel.polec) ? cel.alternatywa : cel.polec; };
    return [
      { key: 'cel', title: 'Pomożemy wybrać', nav: 'Dobór', sub: false, layout: 'chips', options: () => c.ankieta.cel.map(x => ({ id: x.id, label: x.nazwa, meta: null })), aside: 'co chcesz poprawić?' },
      { key: 'skora', sub: true, title: 'Twoja skóra', layout: 'chips', options: () => c.ankieta.skora.map(x => ({ id: x.id, label: x.nazwa, meta: null })),
        after: w => { const p = by(c.zabiegi, polec(w)), alt = by(c.zabiegi, by(c.ankieta.cel, w.cel).alternatywa);
          return `<div style="padding: 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4D9DE; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #9E1F50">POLECAMY</span><b>${Kreator.esc(p.nazwa)}</b><span style="color: #625860; font-size: 13px">Alternatywa: ${Kreator.esc(alt.nazwa.toLowerCase())}. To podpowiedź, nie diagnoza. Ostateczny plan ustala kosmetolożka.</span>`
            + (w.zabieg === p.id ? '<span style="font-size: 13px; color: #1F6B47">Wybrane niżej.</span>' : `<button type="button" data-k="zabieg" data-v="${p.id}" style="align-self: flex-start; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #9E1F50; background: #FFFFFF; color: #9E1F50; font: inherit; font-weight: 500; cursor: pointer">Wybierz polecany zabieg</button>`) + '</div>'; } },
      { key: 'zabieg', title: 'Zabieg', layout: 'list', options: () => offered(c).map(x => ({ id: x.id, label: x.nazwa, hint: x.opis, meta: range(x) })), onChange: fixArea,
        note: 'Ceny zależą od obszaru, dokładna kwota jest w pasku na dole. Iniekcje, PRP, nici, peelingi średnio głębokie, lasery, HIFU i IPL wykonuje lekarz, dlatego nie ma ich w kreatorze.' },
      { key: 'obszar', title: 'Obszar', layout: 'tiles2', show: w => !z(c, w).warianty, onChange: fixArea,
        html: w => `<div class="m-only" style="position: sticky; top: 0; z-index: 2; padding-bottom: 8px; background: #FFFFFF">${areas(w.obszar)}</div>`,
        options: (c2, w) => [...c.obszary, ...c.osobneObszary.filter(o => z(c, w)[o.id])].map(o => ({ id: o.id, label: o.nazwa,
          meta: w2 => { const p = Kreator.obszarCena(z(c, w2), o.id); return p.doplata ? `+${Kreator.zl(p.doplata.cena)} · ${Kreator.zl(p.cena)}` : `${Kreator.zl(p.cena)} · ${Kreator.dur(p.min)}`; } })),
        note: w => (MODE[z(c, w).trybObszaru] ? `Ten zabieg salon wycenia jako: ${MODE[z(c, w).trybObszaru]}.` : '') },
      { key: 'kobido', title: 'Długość masażu', layout: 'tiles2', show: w => !!z(c, w).warianty,
        options: (c2, w) => z(c, w).warianty.map((v, i) => ({ id: String(i), label: `${v.min} min`, meta: `${Kreator.zl(v.cena)}` })) },
      { key: 'dodatki', sub: true, title: 'Dodatki', layout: 'list', multi: true,
        show: w => c.dodatki.some(d => d.dotyczy.includes(w.zabieg) && d.ceny[w.obszar] !== undefined),
        options: (c2, w) => c.dodatki.filter(d => d.dotyczy.includes(w.zabieg) && d.ceny[w.obszar] !== undefined).map(d => ({ id: d.id, label: d.nazwa })) },
      { key: 'seria', title: 'Jeden zabieg czy seria?', nav: 'Seria', layout: 'tiles4',
        options: () => ['1', '3', '5', '10'].map(n => ({ id: n, label: n === '1' ? '1×' : `${n}×`,
          meta: w => { const r = Kreator.wycen.kosmetologia(c, { ...w, seria: n, pierwsza: 'nie' }); return n === '1' ? Kreator.zl(r.cenaMin) : `${Kreator.zl(r.cenaMin)}`; } })),
        note: `Seria płatna z góry przy pierwszej wizycie, ważna ${c.seriaDomyslnie.waznoscMies} miesiące. Odstęp między zabiegami ustali kosmetolożka.` },
      { key: 'pierwsza', sub: true, title: 'Pierwsza wizyta u nas?', layout: 'tiles2',
        options: (c2, w) => { const k = Kreator.konsultacjaZabiegu(c, z(c, w));
          return [{ id: 'tak', label: 'Tak', hint: k.tryb === 'platna_odliczana' ? `konsultacja ${Kreator.zl(k.cena)}, odliczana od zabiegu w ${k.odliczanaDni} dni (${Kreator.dur(k.min)})` : `bezpłatna konsultacja z oceną skóry (${Kreator.dur(k.min)})` }, { id: 'nie', label: 'Nie, byłam już' }]; } },
    ];
  },
});
</script>
</body>
</html>
